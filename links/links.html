<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alquimiadev — Todos mis links</title>

  <meta
    name="description"
    content="Diseño, UX y desarrollo para marcas que quieren vender online. Links directos a mi portfolio, WhatsApp, Instagram y TikTok."
  />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,700&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>

    :root {
      --bg: #2a0a3d;
      --bg-soft: #4a1268;
      --violet: #6a1b9a;
      --violet-light: #9c4dcc;
      --gold: #FFC107;
      --lila: #E1BEE7;
      --text: #FAFAFA;
      --muted: #E1BEE7;
      --border: rgba(255, 193, 7, 0.25);
      --border-soft: rgba(225, 190, 231, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, rgba(225,190,231,0.15), transparent 55%),
        radial-gradient(circle at 80% 90%, rgba(255,193,7,0.10), transparent 50%),
        linear-gradient(160deg, #6a1b9a 0%, #4a1268 55%, #2a0a3d 100%);
      color: var(--text);
      font-family: "Space Grotesk", sans-serif;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(225,190,231,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(225,190,231,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .grid::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(42,10,61,0.7) 100%);
    }

    /* Partículas doradas */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px 2px rgba(255,193,7,0.6);
      animation: float-particle 6s ease-in-out infinite;
    }

    @keyframes float-particle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50%      { transform: translateY(-14px) scale(1.3); opacity: 0.8; }
    }

    /* Símbolo alquímico grande */
    .alchemy-svg {
      position: absolute;
      top: -180px;
      left: 50%;
      transform: translateX(-50%) rotate(12deg);
      width: 620px;
      height: 620px;
      color: var(--gold);
      opacity: 0.10;
      pointer-events: none;
    }

    /* Marco decorativo con esquinas */
    .frame {
      position: fixed;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      border: 1px solid rgba(225, 190, 231, 0.12);
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
    }

    .frame::before,
    .frame::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid var(--gold);
    }

    .frame::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .frame::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    /* =========================
       CONTAINER
    ========================= */

    .links-page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 64px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-symbol {
      font-size: 34px;
      color: var(--gold);
      margin-bottom: 8px;
      animation: float 4s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255,193,7,0.4);
    }

    .brand-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-name em {
      font-family: "JetBrains Mono", monospace;
      font-style: normal;
      color: var(--gold);
      font-weight: 400;
      font-size: 32px;
    }

    .tagline {
      max-width: 340px;
      margin-top: 12px;
      color: var(--lila);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
      opacity: 0.9;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: rgba(42, 10, 61, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(225, 190, 231, 0.2);
      border-radius: 100px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--lila);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #7ed957;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(126, 217, 87, 0.7);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* =========================
       MINI CODE PANEL
    ========================= */

    .mini-code {
      width: 100%;
      padding: 14px 20px;
      margin: 0 0 24px;
      background: rgba(26, 10, 40, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(225, 190, 231, 0.18);
      border-radius: 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text);
      text-align: left;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .mini-code .c-key { color: #ff79c6; }
    .mini-code .c-fn  { color: var(--gold); }
    .mini-code .c-str { color: var(--lila); }

    /* =========================
       BUTTONS
    ========================= */

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;
      width: 100%;
      min-height: 64px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .link:hover {
      transform: translateY(-3px);
    }

    .link-primary {
      background: var(--gold);
      color: #241329;
      box-shadow: 0 10px 30px rgba(255, 193, 7, 0.15);
      font-weight: 600;
    }

    .link-primary:hover {
      box-shadow: 0 14px 35px rgba(255, 193, 7, 0.25);
    }

    .link-secondary {
      background: rgba(42, 10, 61, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(225, 190, 231, 0.22);
      color: var(--text);
    }

    .link-secondary:hover {
      background: rgba(106, 27, 154, 0.35);
      border-color: rgba(255, 193, 7, 0.5);
    }

    .link-icon {
      position: absolute;
      left: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      color: var(--gold);
    }

    .link-primary .link-icon {
      color: #241329;
    }

    /* =========================
       SOCIAL
    ========================= */

    .socials {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .socials a {
      color: var(--lila);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s ease;
      opacity: 0.8;
    }

    .socials a:hover {
      color: var(--gold);
      opacity: 1;
    }

    .socials span {
      color: var(--lila);
      opacity: 0.4;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: auto;
      padding-top: 50px;
      color: var(--lila);
      opacity: 0.5;
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .links-page {
        padding: 48px 20px 28px;
      }

      .brand-name {
        font-size: 32px;
      }

      .brand-name em {
        font-size: 28px;
      }

      .tagline {
        font-size: 14px;
      }

      .alchemy-svg {
        width: 420px;
        height: 420px;
        top: -140px;
      }

      .frame {
        top: 16px;
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .frame::before,
      .frame::after {
        width: 18px;
        height: 18px;
      }

    }

  </style>
</head>

<body>

  <!-- Background decorativo -->
  <div class="background" aria-hidden="true">
    <div class="grid"></div>
    <div class="particles" id="particles"></div>
    <svg class="alchemy-svg" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="3 4"/>
      <polygon points="100,30 170,140 30,140" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="10" fill="currentColor" opacity="0.6"/>
    </svg>
  </div>

  <!-- Marco decorativo -->
  <div class="frame" aria-hidden="true"></div>


  <main class="links-page">

    <!-- Brand -->
    <header class="brand">

      <div class="brand-symbol">◈</div>

      <div class="brand-name">
        alquimia<em>deve</em>
      </div>

      <p class="tagline">
        Diseñamos y configuramos tiendas online<br>
        para marcas que ya venden.
      </p>

    </header>


    <!-- Status -->
    <div class="status">
      <span class="status-dot"></span>
      disponible para nuevos proyectos
    </div>


    <!-- Mini panel de código -->
    <div class="mini-code">
      <span class="c-key">const</span> <span class="c-fn">tienda</span> = <span class="c-str">"✨ online"</span>;
    </div>


    <!-- Links principales -->
    <nav class="links" aria-label="Enlaces principales">

      <a
        class="link link-primary"
        href="https://alquimia-deve-web.vercel.app/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon">✦</span>
        Conocé Alquimiadev
      </a>

      <a
        class="link link-secondary"
        href="https://wa.me/5491172546211?text=Hola%20Alquimiadev!%20Quiero%20consultar%20por%20una%20tienda%20online."
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon">◇</span>
        Hablemos por WhatsApp
      </a>

    </nav>


    <!-- Redes -->
    <div class="socials">
      <a
        href="https://www.instagram.com/alquimiadeve/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <span>·</span>

      <a
        href="https://www.tiktok.com/@alquimiadeve"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>
    </div>


    <!-- Footer -->
    <footer class="footer">
      © 2026 Alquimiadev · Diseño + código
    </footer>

  </main>


  <script>
    // Generar partículas doradas
    (function () {
      const container = document.getElementById('particles');
      if (!container) return;
      const count = 30;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = Math.random() * 4 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 100) + '%';
        p.style.animationDelay = (Math.random() * 6) + 's';
        p.style.animationDuration = (4 + Math.random() * 4) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.5;
        container.appendChild(p);
      }
    })();
  </script>

</body>
</html>
