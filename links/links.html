<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alquimiadev — Todos mis links</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg" />

  <meta
    name="description"
    content="Diseño, UX y desarrollo para marcas que quieren vender online. Links directos a mi portfolio, WhatsApp, Instagram y TikTok."
  />
  <!-- analytics -->

  <script async src="https://plausible.io/js/pa-9VZsGgUSkBNHx3K1E_bMy.js"></script>

  <!-- Fuentes autoalojadas (mismos archivos que index.html) -->
  <link rel="preload" href="../fonts/space-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  

  <link rel="stylesheet" href="links.css" />
</head>

<body>

  <!-- Background decorativo -->
  <div class="background" aria-hidden="true">
    <div class="grid"></div>
    <div class="particles" id="particles"></div>
    <svg class="alchemy-svg" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="3 4"/>
      <polygon points="100,30 170,140 30,140" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="10" fill="currentColor" opacity="0.6"/>
    </svg>
  </div>

  <!-- Marco decorativo -->
  <div class="frame" aria-hidden="true"></div>


  <main class="links-page">

    <!-- Brand -->
    <header class="brand">

      <div class="brand-symbol" aria-hidden="true">◈</div>

      <div class="brand-name">
        alquimia<em>deve</em>
      </div>

      <p class="tagline">
        Diseñamos y configuramos tiendas online<br>
        para marcas que ya venden.
      </p>

    </header>


    <!-- Status -->
    <p class="status">
      <span class="status-dot" aria-hidden="true"></span>
      disponible para nuevos proyectos
    </p>


    <!-- Mini panel de código -->
    <div class="mini-code" aria-hidden="true">
      <span class="c-key">const</span> <span class="c-fn">tienda</span> = <span class="c-str">"✨ online"</span>;
    </div>


    <!-- Links principales -->
    <nav class="links" aria-label="Enlaces principales">

      <a
        class="link link-primary"
        href="https://alquimia-deve-web.vercel.app/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon" aria-hidden="true">✦</span>
        Conocé Alquimiadeve
      </a>

      <a
        class="link link-secondary"
        href="https://wa.me/5491172546211?text=Hola%20Alquimiadev!%20Quiero%20consultar%20por%20una%20tienda%20online."
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon" aria-hidden="true">◇</span>
        Hablemos por WhatsApp
        <span class="sr-only"> (se abre en una pestaña nueva)</span>
      </a>

    </nav>


    <!-- Redes -->
    <div class="socials">
      <a
        href="https://www.instagram.com/alquimiadeve/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <span aria-hidden="true">·</span>

      <a
        href="https://www.tiktok.com/@alquimiadeve"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>
    </div>


    <!-- Footer -->
    <footer class="footer">
      © 2026 Alquimiadeve · Diseño + código
    </footer>

  </main>


  <script src="../analytics.js" defer></script>
<script src="links.js" defer></script>

</body>
</html>
